name: etp 

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: [11, 17, 21]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: temurin

      - name: Build with Maven
        run: mvn -B clean install

      - name: Run tests
        run: mvn test

  report:
    runs-on: ubuntu-latest
    needs: build   
    if: ${{ always() }} 
    steps:
      - name: Report results
        run: |
          
          if [ "${{ needs.build.result }}" == "success" ]; then
            echo " All Java versions passed!"
          else
            echo "Some Java versions failed!"
            echo "Result: ${{ needs.build.result }}"
          fi

